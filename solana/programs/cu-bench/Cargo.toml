[package]
name = "cu-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Compute-unit benchmark: runs orbital-math swaps on-chain and checks the results"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
orbital-math = { path = "../../crates/orbital-math" }
pinocchio = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "0.16"
serde_json = "1"
solana-compute-budget-interface = "3.0"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-pubkey = "4"
solana-signer = "3.0"
solana-transaction = "4.1"
