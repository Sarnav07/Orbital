[package]
name = "orbital-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anchor-lang = "1.2.0"
bytemuck = "1"
orbital = { version = "0.1.0", path = "../../programs/orbital", features = ["no-entrypoint"] }
orbital-math = { version = "0.1.0", path = "../orbital-math" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
solana-commitment-config = "3.1.1"
solana-compute-budget-interface = "3.0"
solana-keypair = "3.1"
solana-rpc-client = "4.2"
solana-signer = "3.0"
solana-system-interface = "3.2"
solana-transaction = "4.1"
spl-associated-token-account-interface = "2.0"
spl-token-interface = "3.0"
