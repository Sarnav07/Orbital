<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Orbital — one reserve book for n stablecoins</title>
  <desc id="desc">n stablecoins orbit one shared reserve book; four are shown, as deployed, with nested tick rings around the equal-price point.</desc>
  <rect width="1440" height="560" fill="#020202"/>
  <g fill="none" stroke="#f2f3f5">
    <circle cx="1080" cy="280" r="210" stroke-opacity=".12" stroke-dasharray="3 9"/>
    <circle cx="1080" cy="280" r="158" stroke-opacity=".22"/>
    <circle cx="1080" cy="280" r="104" stroke-opacity=".45"/>
    <circle cx="1080" cy="280" r="52" stroke-opacity=".8"/>
    <path d="M870 280h420M1080 70v420" stroke-opacity=".12" stroke-dasharray="2 8"/>
  </g>
  <circle cx="1080" cy="280" r="6" fill="#f2f3f5"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f2f3f5" letter-spacing="2">
    <g><circle cx="1080" cy="122" r="7" fill="#f2f3f5"/><text x="1080" y="104" text-anchor="middle">USDC</text></g>
    <g><circle cx="1238" cy="280" r="7" fill="#f2f3f5"/><text x="1262" y="285">USDT</text></g>
    <g><circle cx="1080" cy="438" r="7" fill="#f2f3f5"/><text x="1080" y="468" text-anchor="middle">DAI</text></g>
    <g><circle cx="922" cy="280" r="7" fill="#f2f3f5"/><text x="898" y="285" text-anchor="end">FRAX</text></g>
    <g fill-opacity=".45"><circle cx="1192" cy="168" r="5" fill="none" stroke="#f2f3f5" stroke-dasharray="2 3"/><text x="1206" y="160">+n</text></g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f2f3f5">
    <text x="96" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="4" fill-opacity=".55">EXPERIMENTAL UNISWAP V4 HOOK · UNICHAIN SEPOLIA</text>
    <text x="92" y="262" font-size="112" font-weight="600" letter-spacing="-6">orbital</text>
    <text x="96" y="330" font-size="34" fill-opacity=".85" letter-spacing="-1">One reserve book for n stablecoins.</text>
    <text x="96" y="378" font-size="21" fill-opacity=".5">Any pair · shared concentrated liquidity · live with 4 coins on Unichain Sepolia</text>
