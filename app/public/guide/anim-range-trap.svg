<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Arial, Helvetica, sans-serif">
  <!-- One coin depegs from $1.00 to $0.40 and back. Each range traps at its boundary price and recovers. Loops every 10 s.
       Price axis: x = 200 + (1.00 - p) / 0.70 * 560  (p = 1.00 → 200, p = 0.30 → 760).
       Trap prices from the demo ranges: 0.90 (k/r 1.001), 0.80 (1.004), 0.36 (1.05). -->
  <rect width="880" height="400" rx="16" fill="#121212"/>
  <text x="440" y="40" fill="#e9e9ef" font-size="20" font-weight="700" text-anchor="middle">A coin depegs: each range stops at its own boundary</text>

  <!-- Axis -->
  <line x1="200" y1="330" x2="760" y2="330" stroke="#5b5d6b" stroke-width="1.5"/>
  <g fill="#8a8c9b" font-size="12.5" text-anchor="middle">
    <line x1="200" y1="330" x2="200" y2="336" stroke="#5b5d6b"/><text x="200" y="352">$1.00</text>
    <line x1="280" y1="330" x2="280" y2="336" stroke="#5b5d6b"/><text x="280" y="352">$0.90</text>
    <line x1="360" y1="330" x2="360" y2="336" stroke="#5b5d6b"/><text x="360" y="352">$0.80</text>
    <line x1="520" y1="330" x2="520" y2="336" stroke="#5b5d6b"/><text x="520" y="352">$0.60</text>
    <line x1="712" y1="330" x2="712" y2="336" stroke="#5b5d6b"/><text x="712" y="352">$0.36</text>
  </g>
  <text x="480" y="378" fill="#a7a7b3" font-size="13" text-anchor="middle">price of the failing coin</text>

  <!-- Range rows: label, active band (from $1 to its trap price), status pill -->
  <g font-size="14">
    <text x="40" y="104" fill="#e9e9ef" font-weight="700">Range 1</text><text x="40" y="122" fill="#8a8c9b" font-size="12">k/r 1.001 · 13.1×</text>
    <rect x="200" y="98" width="80" height="12" rx="6" fill="#9b87ff"/>
    <rect x="280" y="98" width="480" height="12" rx="6" fill="#26262e"/>
    <text x="40" y="184" fill="#e9e9ef" font-weight="700">Range 2</text><text x="40" y="202" fill="#8a8c9b" font-size="12">k/r 1.004 · 6.6×</text>
    <rect x="200" y="178" width="160" height="12" rx="6" fill="#9b87ff"/>
    <rect x="360" y="178" width="400" height="12" rx="6" fill="#26262e"/>
    <text x="40" y="264" fill="#e9e9ef" font-weight="700">Range 3</text><text x="40" y="282" fill="#8a8c9b" font-size="12">k/r 1.05 · 2.0×</text>
    <rect x="200" y="258" width="512" height="12" rx="6" fill="#9b87ff"/>
    <rect x="712" y="258" width="48" height="12" rx="6" fill="#26262e"/>
  </g>

  <!-- Status pills (right). Range 1 traps at t=0.075, recovers at t=0.925; Range 2 at 0.15 / 0.85; Range 3 never. -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <g><rect x="780" y="92" width="84" height="24" rx="12" fill="#0f2e22" stroke="#21c95e"/><text x="822" y="109" fill="#21c95e">In range</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;0.075;0.925"/></g>
    <g opacity="0"><rect x="780" y="92" width="84" height="24" rx="12" fill="#33260a" stroke="#ffbf17"/><text x="822" y="109" fill="#ffbf17">Boundary</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.075;0.925"/></g>
    <g><rect x="780" y="172" width="84" height="24" rx="12" fill="#0f2e22" stroke="#21c95e"/><text x="822" y="189" fill="#21c95e">In range</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;0.15;0.85"/></g>
    <g opacity="0"><rect x="780" y="172" width="84" height="24" rx="12" fill="#33260a" stroke="#ffbf17"/><text x="822" y="189" fill="#ffbf17">Boundary</text>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.15;0.85"/></g>
    <g><rect x="780" y="252" width="84" height="24" rx="12" fill="#0f2e22" stroke="#21c95e"/><text x="822" y="269" fill="#21c95e">In range</text></g>
  </g>

  <!-- Price cursor: $1.00 → $0.40 (x 680) and back -->
  <g>
    <line x1="200" y1="76" x2="200" y2="330" stroke="#e9e9ef" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="x1" dur="10s" repeatCount="indefinite" values="200;680;680;200" keyTimes="0;0.45;0.55;1"/>
      <animate attributeName="x2" dur="10s" repeatCount="indefinite" values="200;680;680;200" keyTimes="0;0.45;0.55;1"/>
    </line>
    <circle cx="200" cy="330" r="7" fill="#e9e9ef">
      <animate attributeName="cx" dur="10s" repeatCount="indefinite" values="200;680;680;200" keyTimes="0;0.45;0.55;1"/>
    </circle>
  </g>
  <text x="440" y="70" fill="#a7a7b3" font-size="13" text-anchor="middle">Narrow ranges trap early and stop absorbing the failing coin; the wide range keeps the book tradable.</text>
</svg>
