[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "../packages/fixtures" }, { access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 4096
